apiVersion: v1
kind: Secret
metadata:
  name: fandian-backend-secret
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: "123456"
  WECHAT_SECRET: "replace_with_your_wechat_secret"
  SYNC_SECRET_KEY: "your_sync_secret_key"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fandian-backend-config
data:
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/fandian?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true"
  SPRING_DATASOURCE_USERNAME: "root"
  WECHAT_APPID: "wx07f51ff5b1461249"
  JAVA_OPTS: "-Xms256m -Xmx512m"
  TZ: "Asia/Shanghai"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fandian-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fandian-backend
  template:
    metadata:
      labels:
        app: fandian-backend
    spec:
      containers:
        - name: fandian-backend
          image: fandian-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fandian-backend-config
            - secretRef:
                name: fandian-backend-secret
          readinessProbe:
            httpGet:
              path: /api/food/random
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/food/random
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: fandian-backend
spec:
  type: NodePort
  selector:
    app: fandian-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
